name: phone_robot_app
description: phone-robot マッピングアプリ。シミュレーション／実機（ARCore＋ESP32）モード切替付き。地図が塗り上がり、タップでゴール指定できる。
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  phone_robot_core:
    path: ../core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
