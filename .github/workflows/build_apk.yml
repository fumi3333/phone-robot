name: Build and Release Flutter APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # リポジトリ内の android/ は自前実装（Kotlin の ArCoreManager / SerialManager、
      # Manifest、build.gradle）が正であり、flutter create で上書きしない。
      # push 経路の都合でコミットできないバイナリ（gradle-wrapper.jar と
      # ランチャーアイコン PNG）だけが欠けている場合は、使い捨ての
      # スキャフォールドからその2種類だけを補う。
      - name: Restore binary scaffold assets (wrapper jar / launcher icons)
        run: |
          set -e
          chmod +x flutter/app/android/gradlew || true
          if [ ! -f flutter/app/android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p "$RUNNER_TEMP/scaffold"
            (cd "$RUNNER_TEMP" && flutter create --org dev.fumiproject --project-name phone_robot_app --platforms=android scaffold)
            cp "$RUNNER_TEMP/scaffold/android/gradle/wrapper/gradle-wrapper.jar" \
               flutter/app/android/gradle/wrapper/gradle-wrapper.jar
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "flutter/app/android/app/src/main/res/mipmap-$d"
              cp "$RUNNER_TEMP/scaffold/android/app/src/main/res/mipmap-$d/ic_launcher.png" \
                 "flutter/app/android/app/src/main/res/mipmap-$d/ic_launcher.png"
            done
          fi

      - name: Install dependencies
        working-directory: flutter/app
        run: |
          flutter pub get

      - name: Build APK (Release)
        working-directory: flutter/app
        run: |
          flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk dist/phone-robot-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: v0.2.0 - Phone Robot App（実機モード対応）
          body: |
            ## Phone Robot アプリ（Android APK）v0.2.0

            Flutter版マッピング＆巡回アプリ。v0.2.0 から実機モードに対応しました。

            ### 機能
            - 占有格子地図（Occupancy Grid）マッピング＋フロンティア探索
            - A* 経路計画 ＆ タップで「ここに行って」ゴール指定ナビゲーション
            - 巡回キット（帰還・経路の保存/再生・立入禁止エリア・変化検出・巡回レポート）
            - シミュレーションモード内蔵（実車・ARCore未接続でも画面上で探索・走行確認可能）
            - 実機モード（新規）: ARCore による自己位置・深度（ToF）取得、USBシリアルで ESP32 と接続
            - Note 10+ リスク修正 R1〜R4（トラッキング喪失時の停止／フェイルセーフのフェイルクローズ化／USB切断時の幻の壁の誤記録防止／画面消灯対策）

            ### インストール手順
            1. 下の **`phone-robot-app.apk`** をスマートフォン（Galaxy Note 10+等）でダウンロード
            2. ダウンロードしたAPKをタップしてインストール（「提供元不明のアプリ」を許可）
          files: dist/phone-robot-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
