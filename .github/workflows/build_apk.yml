name: Build and Release Flutter APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      # リポジトリ内の android/ は自前実装（Kotlin の ArCoreManager / SerialManager、
      # Manifest、build.gradle）が正であり、flutter create で上書きしない。
      # push 経路の都合でコミットできないバイナリ（gradle-wrapper.jar と
      # ランチャーアイコン PNG）だけが欠けている場合は、使い捨ての
      # スキャフォールドからその2種類だけを補う。
      - name: Restore binary scaffold assets (wrapper jar / launcher icons)
        run: |
          set -e
          chmod +x flutter/app/android/gradlew || true
          if [ ! -f flutter/app/android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p "$RUNNER_TEMP/scaffold"
            (cd "$RUNNER_TEMP" && flutter create --org dev.fumiproject --project-name phone_robot_app --platforms=android scaffold)
            cp "$RUNNER_TEMP/scaffold/android/gradle/wrapper/gradle-wrapper.jar" \
               flutter/app/android/gradle/wrapper/gradle-wrapper.jar
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "flutter/app/android/app/src/main/res/mipmap-$d"
              cp "$RUNNER_TEMP/scaffold/android/app/src/main/res/mipmap-$d/ic_launcher.png" \
                 "flutter/app/android/app/src/main/res/mipmap-$d/ic_launcher.png"
            done
          fi

      - name: Install dependencies
        working-directory: flutter/app
        run: |
          flutter pub get

      - name: Run unit tests
        working-directory: flutter/app
        run: |
          flutter test

      - name: Build APK (Release)
        working-directory: flutter/app
        run: |
          flutter build apk --release

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          TAG="${{ github.ref_name }}"
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk "dist/phone-robot-app-${TAG}.apk"
          cp flutter/app/build/app/outputs/flutter-apk/app-release.apk dist/phone-robot-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - Phone Robot App
          body: |
            ## Phone Robot アプリ（Android APK）

            Flutter＋Kotlin 版ワンフロア・マッピングアプリです。

            ### 機能
            - **2モード分離 UI**: 「① 歩いてマップ測定（手持ち）」と「② ラジコン操縦（ボタン／フリック切替）」を切り替え
            - **カメラ同時ライブ表示＋MP4録画**: ARCore カメラ映像プレビュー・障害物距離アラート大バナー・自分中心拡大マップ（全体図切替可）
            - **コマンド変化データの全記録**: 停止時に勝手にドライブへ飛ばず、`command_effects_*.csv` / `floor_map_*.json` / `run_summary_*.md` / `camera_recording_*.mp4` を端末保存し、「ドライブへ送る」押下時のみ送信
            - **バッテリー＆ラグ根本改善＋操舵改善**: ARCore ループのフレーム同期待機・30Hz上限化、先当て舵（`c,0,±255`→低速旋回）・連続フルステア化

            ### インストール手順
            1. 下の **`phone-robot-app-${{ github.ref_name }}.apk`**（または `phone-robot-app.apk`）をスマートフォン（Galaxy Note 10+ 等）でダウンロード
            2. ダウンロードした APK をタップしてインストール（「提供元不明のアプリ」を許可）
          files: |
            dist/phone-robot-app-*.apk
            dist/phone-robot-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
